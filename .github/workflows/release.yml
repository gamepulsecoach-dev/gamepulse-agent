# Release of the GamePulse clip agent. Lives in the public gamepulse-agent repo.
# Push a tag vX.Y.Z -> tests, PyInstaller build, per-user installer, GitHub Release + latest.json.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.22.3 pytest pytest-cov httpx

      - name: Unit tests
        run: python -m pytest -q

      - name: Fetch yt-dlp and LGPL ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools-bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile tools-bin/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          Copy-Item (Get-ChildItem ffmpeg-x -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName tools-bin/
          # The agent encodes with the system encoder (Media Foundation): fail early if missing
          if (-not (./tools-bin/ffmpeg.exe -hide_banner -encoders | Select-String h264_mf)) { throw "ffmpeg sem h264_mf" }

      - name: Build agent
        run: python -m build_tools.build --tools tools-bin

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DDistDir=..\dist\GamePulseAgent" installer\GamePulseAgent.iss

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $setup = "dist/GamePulseAgent-Setup-$version.exe"
          $sha = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          @{
            version = $version
            windows = @{ url = "https://github.com/${{ github.repository }}/releases/download/$tag/GamePulseAgent-Setup-$version.exe"; sha256 = $sha }
          } | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 dist/latest.json
          gh release create $tag $setup dist/latest.json --title "GamePulse Agent $version" --generate-notes

  # TODO(F5 macOS): needs an LGPL ffmpeg with h264_videotoolbox (no ready-made build like BtbN) + .app zip
